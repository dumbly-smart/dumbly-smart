name: Open a channel
description: Start a conversation about a project, security problem, or recommendation.
title: "[signal] "
labels: []
body:
  - type: dropdown
    id: channel
    attributes:
      label: Channel
      options:
        - Project or collaboration
        - Security discussion
        - Manga recommendation
        - Something else
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Message
      description: Do not include credentials, live vulnerabilities, or other sensitive data.
    validations:
      required: true
