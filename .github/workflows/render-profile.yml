name: Update animated GitHub profile

on:
  workflow_dispatch:
  schedule:
    # 11:47 in Asia/Kolkata
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: render-profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Render animated profile
        run: python -m scripts.render_profile
      - name: Commit generated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/info-card.svg README.md
          git diff --cached --quiet || git commit -m "chore: update animated profile [skip ci]"
          git push
