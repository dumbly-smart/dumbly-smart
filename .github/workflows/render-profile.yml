name: Daily Thirukural

on:
  workflow_dispatch:
  schedule:
    # 00:05 in Asia/Kolkata
    - cron: "35 18 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - ".github/workflows/render-profile.yml"

permissions:
  contents: write

concurrency:
  group: render-profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Render today's Thirukural
        run: node scripts/render-thirukural.mjs
      - name: Commit changed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/ README.md
          git diff --cached --quiet || git commit -m "chore: update daily Thirukural"
          git push
