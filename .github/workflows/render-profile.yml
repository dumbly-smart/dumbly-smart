name: Render commit page

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/render-profile.yml"

permissions:
  contents: write

concurrency:
  group: render-profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile activity into SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: dumbly-smart
        run: node scripts/render-commits.mjs
      - name: Commit changed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/ README.md
          git diff --cached --quiet || git commit -m "chore: render commit page"
          git push
