<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title description">
  <title id="title">Thirukural of the day — 748</title>
  <desc id="description">முற்றாற்றி முற்றி யவரையும் பற்றாற்றிப் பற்றியார் வெல்வது அரண். Howe&apos;er the circling foe may strive access to win,A fort should give the victory to those who guard within</desc>
  <rect width="1000" height="340" fill="#0f0f0e"/>
  <text x="54" y="55" fill="#8d8981" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="3.5">THIRUKURAL OF THE DAY</text>
  <text x="946" y="55" text-anchor="end" fill="#8d8981" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">2026-09-01</text>
  <line x1="54" y1="76" x2="946" y2="76" stroke="#32312e"/>
  <text x="54" y="133" fill="#eee9df" font-family="Noto Sans Tamil,Nirmala UI,Latha,sans-serif" font-size="27" font-weight="600">முற்றாற்றி முற்றி யவரையும் பற்றாற்றிப்</text>
  <text x="54" y="179" fill="#eee9df" font-family="Noto Sans Tamil,Nirmala UI,Latha,sans-serif" font-size="27" font-weight="600">பற்றியார் வெல்வது அரண்.</text>
  <line x1="54" y1="211" x2="88" y2="211" stroke="#b44335" stroke-width="3"/>
  <text x="54" y="250" fill="#8d8981" font-family="Georgia,serif" font-size="18" font-style="italic">Howe&apos;er the circling foe may strive access to win, A fort should give the victory</text>
  <text x="54" y="280" fill="#8d8981" font-family="Georgia,serif" font-size="18" font-style="italic">to those who guard within</text>
  <text x="946" y="164" text-anchor="end" fill="#eee9df" font-family="Georgia,serif" font-size="76">748</text>
  <text x="946" y="188" text-anchor="end" fill="#8d8981" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" letter-spacing="2">OF 1330</text>
  <text x="946" y="302" text-anchor="end" fill="#8d8981" font-family="Georgia,serif" font-size="11" font-style="italic">G. U. Pope translation</text>
</svg>