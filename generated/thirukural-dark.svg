<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="k-title k-desc">
  <title id="k-title">Thirukural of the day: Kural 720</title>
  <desc id="k-desc">அங்கணத்துள் உக்க அமிழ்தற்றால் தங்கணத்தார் அல்லார்முன் கோட்டி கொளல். Ambrosia in the sewer spilt, is wordSpoken in presence of the alien herd</desc>
  <rect width="1000" height="300" fill="#111111"/>
  <path d="M28 76H972M790 76V262M28 262H972" stroke="#343434"/>
  <rect x="28" y="45" width="28" height="3" fill="#c43b2f"/>
  <text x="70" y="51" font-family="ui-monospace,monospace" font-size="11" letter-spacing="3" fill="#99958d">THIRUKURAL OF THE DAY</text>
  <text x="942" y="184" text-anchor="end" font-family="Georgia,serif" font-size="92" font-weight="700" fill="#eeeae0">720</text>
  <text x="942" y="213" text-anchor="end" font-family="ui-monospace,monospace" font-size="10" letter-spacing="2" fill="#99958d">OF 1330</text>
  <text x="52" y="119" font-family="Noto Sans Tamil,Nirmala UI,Latha,sans-serif" font-size="24" font-weight="600" fill="#eeeae0">அங்கணத்துள் உக்க அமிழ்தற்றால் தங்கணத்தார்</text>
  <text x="52" y="158" font-family="Noto Sans Tamil,Nirmala UI,Latha,sans-serif" font-size="24" font-weight="600" fill="#eeeae0">அல்லார்முன் கோட்டி கொளல்.</text>
  <path d="M52 187H94" stroke="#c43b2f" stroke-width="3"/>
  <text x="52" y="221" font-family="Georgia,serif" font-size="17" font-style="italic" fill="#99958d">Ambrosia in the sewer spilt, is wordSpoken in presence of the alien herd</text>
  
</svg>