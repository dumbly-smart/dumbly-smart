<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 110" role="img" aria-label="Daily Thirukkural"><title>Daily Thirukkural</title><style>.kural{fill:#79c0ff;font:22px sans-serif}.english{fill:#c9d1d9;font:16px sans-serif}.line{animation:rise .7s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style><clipPath id="kural-tamil-0"><rect x="0" y="18" width="0" height="28"><animate attributeName="width" from="0" to="720" dur="1.75s" begin="80ms" fill="freeze"/></rect></clipPath><g class="line" style="animation-delay:80ms" clip-path="url(#kural-tamil-0)"><text class="kural" x="24" y="36">நகையுள்ளும் இன்னா திகழ்ச்சி பகையுள்ளும்</text></g><clipPath id="kural-tamil-1"><rect x="0" y="48" width="0" height="28"><animate attributeName="width" from="0" to="720" dur="1.20s" begin="140ms" fill="freeze"/></rect></clipPath><g class="line" style="animation-delay:140ms" clip-path="url(#kural-tamil-1)"><text class="kural" x="24" y="66">பண்புள பாடறிவார் மாட்டு.</text></g><clipPath id="kural-english"><rect x="0" y="86" width="0" height="28"><animate attributeName="width" from="0" to="720" dur="2.68s" begin="200ms" fill="freeze"/></rect></clipPath><g class="line" style="animation-delay:200ms" clip-path="url(#kural-english)"><text class="english" x="24" y="104">Contempt is evil though in sport They who man&#x27;s nature know,E&#x27;en in their wrath, a courteous mind will show</text></g></svg>