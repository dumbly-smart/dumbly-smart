<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title description">
  <title id="title">Thirukural of the day — 756</title>
  <desc id="description">உறுபொருளும் உல்கு பொருளும்தன் ஒன்னார்த் தெறுபொருளும் வேந்தன் பொருள். Wealth that falls to him as heir, wealth from the kingdom&apos;s dues,</desc>
  <rect width="1000" height="340" fill="#f4f0e7"/>
  <text x="54" y="55" fill="#6f6a62" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="3.5">THIRUKURAL OF THE DAY</text>
  <text x="946" y="55" text-anchor="end" fill="#6f6a62" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">2026-09-09</text>
  <line x1="54" y1="76" x2="946" y2="76" stroke="#d2ccc0"/>
  <text x="54" y="133" fill="#171715" font-family="Noto Sans Tamil,Nirmala UI,Latha,sans-serif" font-size="27" font-weight="600">உறுபொருளும் உல்கு பொருளும்தன் ஒன்னார்த்</text>
  <text x="54" y="179" fill="#171715" font-family="Noto Sans Tamil,Nirmala UI,Latha,sans-serif" font-size="27" font-weight="600">தெறுபொருளும் வேந்தன் பொருள்.</text>
  <line x1="54" y1="211" x2="88" y2="211" stroke="#b44335" stroke-width="3"/>
  <text x="54" y="250" fill="#6f6a62" font-family="Georgia,serif" font-size="18" font-style="italic">Wealth that falls to him as heir, wealth from the kingdom&apos;s dues,</text>
  
  <text x="946" y="164" text-anchor="end" fill="#171715" font-family="Georgia,serif" font-size="76">756</text>
  <text x="946" y="188" text-anchor="end" fill="#6f6a62" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" letter-spacing="2">OF 1330</text>
  <text x="946" y="302" text-anchor="end" fill="#6f6a62" font-family="Georgia,serif" font-size="11" font-style="italic">G. U. Pope translation</text>
</svg>