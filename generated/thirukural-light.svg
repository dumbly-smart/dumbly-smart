<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title description">
  <title id="title">Thirukural of the day — 745</title>
  <desc id="description">கொளற்கரிதாய்க் கொண்டகூழ்த் தாகி அகத்தார் நிலைக்கெளிதாம் நீரது அரண். Impregnable, containing ample stores of food,A fort for those within, must be a warlike station good</desc>
  <rect width="1000" height="340" fill="#f4f0e7"/>
  <text x="54" y="55" fill="#6f6a62" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="3.5">THIRUKURAL OF THE DAY</text>
  <text x="946" y="55" text-anchor="end" fill="#6f6a62" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">2026-08-29</text>
  <line x1="54" y1="76" x2="946" y2="76" stroke="#d2ccc0"/>
  <text x="54" y="133" fill="#171715" font-family="Noto Sans Tamil,Nirmala UI,Latha,sans-serif" font-size="27" font-weight="600">கொளற்கரிதாய்க் கொண்டகூழ்த் தாகி அகத்தார்</text>
  <text x="54" y="179" fill="#171715" font-family="Noto Sans Tamil,Nirmala UI,Latha,sans-serif" font-size="27" font-weight="600">நிலைக்கெளிதாம் நீரது அரண்.</text>
  <line x1="54" y1="211" x2="88" y2="211" stroke="#b44335" stroke-width="3"/>
  <text x="54" y="250" fill="#6f6a62" font-family="Georgia,serif" font-size="18" font-style="italic">Impregnable, containing ample stores of food, A fort for those within, must be a</text>
  <text x="54" y="280" fill="#6f6a62" font-family="Georgia,serif" font-size="18" font-style="italic">warlike station good</text>
  <text x="946" y="164" text-anchor="end" fill="#171715" font-family="Georgia,serif" font-size="76">745</text>
  <text x="946" y="188" text-anchor="end" fill="#6f6a62" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" letter-spacing="2">OF 1330</text>
  <text x="946" y="302" text-anchor="end" fill="#6f6a62" font-family="Georgia,serif" font-size="11" font-style="italic">G. U. Pope translation</text>
</svg>