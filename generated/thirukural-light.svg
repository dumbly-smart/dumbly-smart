<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title description">
  <title id="title">Thirukural of the day — 737</title>
  <desc id="description">இருபுனலும் வாய்ந்த மலையும் வருபுனலும் வல்லரணும் நாட்டிற்கு உறுப்பு. Waters from rains and springs, a mountain near, and waters thence;These make a land, with fortress&apos; sure defence</desc>
  <rect width="1000" height="340" fill="#f4f0e7"/>
  <text x="54" y="55" fill="#6f6a62" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="3.5">THIRUKURAL OF THE DAY</text>
  <text x="946" y="55" text-anchor="end" fill="#6f6a62" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2">2026-08-21</text>
  <line x1="54" y1="76" x2="946" y2="76" stroke="#d2ccc0"/>
  <text x="54" y="133" fill="#171715" font-family="Noto Sans Tamil,Nirmala UI,Latha,sans-serif" font-size="27" font-weight="600">இருபுனலும் வாய்ந்த மலையும் வருபுனலும்</text>
  <text x="54" y="179" fill="#171715" font-family="Noto Sans Tamil,Nirmala UI,Latha,sans-serif" font-size="27" font-weight="600">வல்லரணும் நாட்டிற்கு உறுப்பு.</text>
  <line x1="54" y1="211" x2="88" y2="211" stroke="#b44335" stroke-width="3"/>
  <text x="54" y="250" fill="#6f6a62" font-family="Georgia,serif" font-size="18" font-style="italic">Waters from rains and springs, a mountain near, and waters thence; These make a</text>
  <text x="54" y="280" fill="#6f6a62" font-family="Georgia,serif" font-size="18" font-style="italic">land, with fortress&apos; sure defence</text>
  <text x="946" y="164" text-anchor="end" fill="#171715" font-family="Georgia,serif" font-size="76">737</text>
  <text x="946" y="188" text-anchor="end" fill="#6f6a62" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" letter-spacing="2">OF 1330</text>
  <text x="946" y="302" text-anchor="end" fill="#6f6a62" font-family="Georgia,serif" font-size="11" font-style="italic">G. U. Pope translation</text>
</svg>