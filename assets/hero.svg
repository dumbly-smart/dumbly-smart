<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc">
  <title id="title">dumbly-smart</title>
  <desc id="desc">Security engineer and systems builder. Inspect, understand, rebuild.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7df9ff" stroke-opacity=".08"/>
    </pattern>
    <pattern id="tone" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#ffffff" opacity=".14"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#080a0d"/><stop offset=".7" stop-color="#10151b"/><stop offset="1" stop-color="#071316"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><path d="M18 18H982V292H18Z"/></clipPath>
  </defs>
  <rect width="1000" height="310" rx="12" fill="url(#fade)"/>
  <rect width="1000" height="310" rx="12" fill="url(#grid)"/>
  <path d="M705 0L1000 0V310H615Z" fill="url(#tone)"/>
  <path d="M760 0L596 310M820 0L656 310M880 0L716 310M940 0L776 310" stroke="#7df9ff" stroke-opacity=".16" stroke-width="2"/>
  <g clip-path="url(#frame)">
    <rect x="0" y="-40" width="1000" height="3" fill="#7df9ff" opacity=".25">
      <animate attributeName="y" from="-40" to="340" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M33 52V33H52M948 33H967V52M33 258V277H52M948 277H967V258" fill="none" stroke="#7df9ff" stroke-width="2"/>
  <circle cx="51" cy="68" r="4" fill="#7df9ff" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="68" y="73" fill="#7df9ff" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" letter-spacing="3">SYSTEMS / SECURITY / RESEARCH</text>
  <text x="49" y="157" fill="#f4f5f6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="70" font-weight="800" letter-spacing="-4">dumbly-smart</text>
  <rect x="51" y="177" width="553" height="2" fill="#7df9ff" opacity=".7"/>
  <text x="51" y="214" fill="#a9b0b7" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17">inspect → understand → rebuild</text>
  <text x="51" y="258" fill="#59636d" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" letter-spacing="2">THE INTERFACE IS NOT THE SYSTEM</text>
  <g transform="translate(835 158)" fill="none" stroke="#7df9ff" opacity=".72">
    <circle r="67"/><circle r="49" stroke-dasharray="4 8"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/></circle>
